<svg xmlns="http://www.w3.org/2000/svg" width="850" height="136" viewBox="-2 -2 850 136"><style>
.card{animation:up .7s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.c0{animation-delay:0.00s}.c1{animation-delay:0.12s}.c2{animation-delay:0.24s}.c3{animation-delay:0.36s}
.num{font:800 40px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif}
.cap{font:500 14px 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif;fill:#CBD5E1}
