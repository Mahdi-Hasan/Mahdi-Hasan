<svg xmlns="http://www.w3.org/2000/svg" width="848" height="126" viewBox="-1 -1 848 126"><style>
.card{animation:up .6s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.bg{fill:#FFFFFF;stroke:#D0D7DE}
.chip{fill:#F6F8FA}
.num{font:700 32px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#1F2328}
.cap{font:500 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#1F2328}
.sub{font:400 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;fill:#59636E}
.ico{font:20px 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif}
@media (prefers-color-scheme: dark){
.bg{fill:#0D1117;stroke:#30363D}
.chip{fill:#161B22}
.num,.cap{fill:#E6EDF3}
.sub{fill:#9198A1}
}
