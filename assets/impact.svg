<svg xmlns="http://www.w3.org/2000/svg" width="848" height="272" viewBox="-1 -1 848 272"><style>
.card{animation:up .5s ease-out both}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.bg{fill:#FFFFFF;stroke:#E4E7EC}
.ico{stroke:#4F46E5;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lbl{font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif;letter-spacing:.08em;fill:#667085}
.num{font:700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif;letter-spacing:-.02em;fill:url(#gl)}
.sub{font:400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif;fill:#475467}
.bar{fill:url(#gl)}
@media (prefers-color-scheme: dark){
.bg{fill:#0D1117;stroke:#262C36}
.ico{stroke:#818CF8}
.lbl{fill:#8B949E}
.num{fill:url(#gd)}
.sub{fill:#C9D1D9}
.bar{fill:url(#gd)}
}
</style>
